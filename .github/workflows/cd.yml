name: CD

# push 進 main 才跑：依序 test → build-push → deploy。
on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/fpi-tw/ai-stock

# 不取消進行中的舊跑：新 push 排隊等舊 run（含部署）跑完，避免半途換版。
# （只在 workflow 層 false 才擋得住整 run 被取消；deploy job 自身的序列化擋不住這層。）
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  # 部署前先過測試門檻（與 CI 共用 test.yml）；測不過就不會 build、不會部署。
  test:
    uses: ./.github/workflows/test.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 防 build/push 異常掛到預設 6 小時、空燒 runner 額度。

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    # 連線/部署卡死時及時失敗（預設 job timeout 是 6 小時）；配 cancel-in-progress:false
    # 不能讓掛死的 run 霸佔部署佇列，否則後續 main 部署（含 hotfix）全部乾等。
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    # 部署序列化：排隊等前一個部署跑完（與 workflow 層一致，雙重保險）。
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: 推送設定並透過 SSH 部署到 EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          # .env.prod 參數：逐項對應一個 GitHub Secret/Variable，於下方組成 .env.prod 後推到 EC2。
          # 對照範本 .env.prod.example；新增一行就在這裡和下方 heredoc 各補一行。
          APP_ENV: ${{ vars.APP_ENV }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_VERSION: ${{ vars.APP_VERSION }}
          LOCAL_MODE: ${{ vars.LOCAL_MODE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REQUEST_ID_HEADER: ${{ vars.REQUEST_ID_HEADER }}
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          TRUSTED_PROXY_IPS: ${{ vars.TRUSTED_PROXY_IPS }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          QUOTE_PROVIDER: ${{ vars.QUOTE_PROVIDER }}
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          SHIOAJI_MAX_SUBSCRIPTIONS: ${{ vars.SHIOAJI_MAX_SUBSCRIPTIONS }}
          SHIOAJI_SIMULATION: ${{ vars.SHIOAJI_SIMULATION }}
          SHIOAJI_DEMO_ALLOWED_SYMBOLS: ${{ secrets.SHIOAJI_DEMO_ALLOWED_SYMBOLS }}
          SES_FROM_ADDRESS: ${{ vars.SES_FROM_ADDRESS }}
          SES_REGION: ${{ vars.SES_REGION }}
          SES_SMTP_USERNAME: ${{ secrets.SES_SMTP_USERNAME }}
          SES_SMTP_PASSWORD: ${{ secrets.SES_SMTP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_TIMEOUT_SECONDS: ${{ vars.TELEGRAM_TIMEOUT_SECONDS }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_OWNER_EMAIL: ${{ vars.TELEGRAM_OWNER_EMAIL }}
          TELEGRAM_WEBHOOK_URL: ${{ vars.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_LLM_MODEL: ${{ vars.TELEGRAM_LLM_MODEL }}
          TELEGRAM_LLM_TIMEOUT_SECONDS: ${{ vars.TELEGRAM_LLM_TIMEOUT_SECONDS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TWAP_WORKER_ENABLED: ${{ vars.TWAP_WORKER_ENABLED }}
          TWAP_WORKER_INTERVAL_SECONDS: ${{ vars.TWAP_WORKER_INTERVAL_SECONDS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 釘住 host key 防 MITM；EC2_KNOWN_HOSTS 由 `ssh-keyscan <host>` 取得。
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # ConnectTimeout 讓連不上時快速失敗；ServerAlive* 在連上後主機失聯時 ~45s 內斷線，
          # 不讓 ssh 無限掛到 job timeout。此陣列同時供下方 scp 與 ssh 使用。
          ssh_opts=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts
                    -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          deploy_dir="/home/ubuntu/app/ai-stock"

          # 確保遠端目錄存在。
          ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" "mkdir -p '$deploy_dir/nginx'"

          # 推送式：把本次 commit 的 compose + nginx 設定 scp 到 EC2（EC2 不需 git）。
          scp "${ssh_opts[@]}" docker-compose.prod.yml "$EC2_USER@$EC2_HOST:$deploy_dir/"
          scp "${ssh_opts[@]}" nginx/nginx.conf "$EC2_USER@$EC2_HOST:$deploy_dir/nginx/"

          # 從 GitHub Secrets/Variables 組出 .env.prod 再推到 EC2（取代過去使用者手放在主機的做法）。
          # 值先經 step env 帶入再以 heredoc 寫檔（引用 ${VAR} 而非把機密直接內插進 YAML），
          # 避免含 $ / 反引號等特殊字元的密碼破壞腳本；heredoc 展開出的值不會被再次求值。
          # umask 077 讓本地落檔即 600；scp 不保留權限，故推完再於遠端 chmod 600。
          umask 077
          cat > .env.prod <<EOF
          APP_ENV=${APP_ENV}
          APP_NAME=${APP_NAME}
          APP_VERSION=${APP_VERSION}
          LOCAL_MODE=${LOCAL_MODE}
          DATABASE_URL=${DATABASE_URL}
          REQUEST_ID_HEADER=${REQUEST_ID_HEADER}
          CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}
          APP_BASE_URL=${APP_BASE_URL}
          TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS}
          JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
          MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY}
          QUOTE_PROVIDER=${QUOTE_PROVIDER}
          SHIOAJI_API_KEY=${SHIOAJI_API_KEY}
          SHIOAJI_SECRET_KEY=${SHIOAJI_SECRET_KEY}
          SHIOAJI_MAX_SUBSCRIPTIONS=${SHIOAJI_MAX_SUBSCRIPTIONS}
          SHIOAJI_SIMULATION=${SHIOAJI_SIMULATION}
          SHIOAJI_DEMO_ALLOWED_SYMBOLS=${SHIOAJI_DEMO_ALLOWED_SYMBOLS}
          SES_FROM_ADDRESS=${SES_FROM_ADDRESS}
          SES_REGION=${SES_REGION}
          SES_SMTP_USERNAME=${SES_SMTP_USERNAME}
          SES_SMTP_PASSWORD=${SES_SMTP_PASSWORD}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          TELEGRAM_TIMEOUT_SECONDS=${TELEGRAM_TIMEOUT_SECONDS}
          TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
          TELEGRAM_OWNER_EMAIL=${TELEGRAM_OWNER_EMAIL}
          TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
          TELEGRAM_LLM_MODEL=${TELEGRAM_LLM_MODEL}
          TELEGRAM_LLM_TIMEOUT_SECONDS=${TELEGRAM_LLM_TIMEOUT_SECONDS}
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          TWAP_WORKER_ENABLED=${TWAP_WORKER_ENABLED}
          TWAP_WORKER_INTERVAL_SECONDS=${TWAP_WORKER_INTERVAL_SECONDS}
          EOF
          scp "${ssh_opts[@]}" .env.prod "$EC2_USER@$EC2_HOST:$deploy_dir/"
          ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" "chmod 600 '$deploy_dir/.env.prod'"
          rm -f .env.prod

          # 機密以 stdin（而非遠端命令列引數）餵入遠端 bash：先送一行 export，再接
          # deploy.sh 內文。遠端 argv 僅 `bash -s`，token 不出現在 EC2 的 ps / proc cmdline。
          {
            printf 'export IMAGE_TAG=%q GHCR_ACTOR=%q GHCR_TOKEN=%q\n' \
              "$IMAGE_TAG" "$GHCR_ACTOR" "$GHCR_TOKEN"
            cat scripts/deploy.sh
          } | ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" 'bash -s'

          # deploy.sh only returns after the app healthcheck succeeds. Register
          # the webhook afterwards and verify both URL and allowed update types;
          # a mismatch fails this CD run instead of silently leaving Telegram on
          # an old deployment.
          python3 scripts/setup_telegram_webhook.py --url "$TELEGRAM_WEBHOOK_URL"
