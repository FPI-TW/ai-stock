repos:
  - repo: local
    hooks:
      - id: ruff-check-fix
        name: ruff check --fix
        entry: uv run ruff check --fix .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-shioaji-isolation
        name: check shioaji_demo isolation
        entry: make check-shioaji-isolation
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: uv run pytest -s
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # UI smoke tests — Playwright drives a real chromium against a real
      # uvicorn subprocess + local PostgreSQL. One-time setup:
      #   uv run playwright install chromium
      # Skip an individual push that lacks the prereqs with:
      #   SKIP=pytest-ui git push
      - id: pytest-ui
        name: pytest UI smoke (PostgreSQL + chromium)
        entry: bash -c 'DATABASE_URL="${DATABASE_URL:-postgresql+psycopg://ai_stock:ai_stock@localhost:5432/ai_stock}" uv run pytest -m ui -s'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
