# 正式環境部署：一次性 migrate + app(FastAPI HTTP) + worker(背景排程) + nginx 反向代理。
# 資料庫用 AWS RDS / Aurora（由 .env.prod 的 DATABASE_URL 指定），不在 compose 內自架 postgres。
# 映像由 CI build 後推到 GHCR，EC2 只 pull、不在本機 build（見 .github/workflows/ci-cd.yml）。
# 手動部署時用法：
#   1. cp .env.prod.example .env.prod 並填入真實機密（DATABASE_URL / JWT / MFA / Shioaji）。
#   2. echo "$GHCR_TOKEN" | docker login ghcr.io -u <github_user> --password-stdin
#   3. IMAGE_TAG=<commit_sha 或 latest> docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   4. IMAGE_TAG=<同上> docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# 對外只暴露 nginx（80/443）；app / worker 留在內部網路，資料庫連外部 RDS。
# 背景排程（TWAP / idempotency cleanup）只在單一 worker process 跑（見 worker service /
# issue #53），不隨 app 的 uvicorn worker 數放大。

services:
  # 一次性執行 DB migration，成功後 app 才啟動，避免多 worker 併發跑 alembic。
  # 映像由 CI build 後推到 GHCR；EC2 只 pull，migrate / app / worker 共用同一 IMAGE_TAG。
  migrate:
    image: ghcr.io/fpi-tw/ai-stock:${IMAGE_TAG:-latest}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - backend

  app:
    # 映像由 CI build 後推到 GHCR；EC2 只 pull，不在本機 build。IMAGE_TAG 由部署腳本帶入
    # 該次 commit 的 SHA；未設時退回 latest。migrate / app / worker 共用同一 tag。
    image: ghcr.io/fpi-tw/ai-stock:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # 背景排程改由下方獨立 worker 跑。app 的多個 uvicorn worker 只服務 HTTP，
      # 不各起一份排程，避免 ×worker 數放大 TWAP/cleanup 的 DB 輪詢（issue #53）。
      TWAP_WORKER_ENABLED: "false"
      IDEMPOTENCY_CLEANUP_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # 背景排程專責 worker（單一 process）：TWAP slice 排程 + idempotency cleanup。
  # 與 app 同 image，但 --workers 1 → 背景排程只跑一份，不隨 app 的 worker 數放大
  # （issue #53）。不對外、不掛 nginx，只在內網跑排程。
  worker:
    # 與 app 同一 GHCR 映像（同 IMAGE_TAG），不自帶 build。
    image: ghcr.io/fpi-tw/ai-stock:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command:
      ["uvicorn", "app.main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8100", "--workers", "1"]
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # 排程只在此 service 開啟（app 已關閉）。
      TWAP_WORKER_ENABLED: "true"
      IDEMPOTENCY_CLEANUP_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS 憑證：在 EC2 的 ./nginx/certs/ 放 Cloudflare Origin CA 憑證
      # （fullchain.pem / privkey.pem），對應 nginx.conf 443 區塊的路徑。不進版控。
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
    # 固定子網，讓 app 的 TRUSTED_PROXY_IPS 能精準信任 nginx（XFF 取真實 client IP）。
    # 改這裡的話，.env.prod 的 TRUSTED_PROXY_IPS 要一起改。
    ipam:
      config:
        - subnet: 172.28.0.0/16
