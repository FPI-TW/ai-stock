# 正式環境部署：一次性 migrate + app(FastAPI HTTP + 背景排程) + nginx 反向代理（HTTP/HTTPS）。
# 資料庫用 AWS RDS / Aurora（由 .env.prod 的 DATABASE_URL 指定），不在 compose 內自架 postgres。
# 映像由 CI build 後推到 GHCR，EC2 只 pull、不在本機 build（見 .github/workflows/cd.yml）。
# 手動部署時用法：
#   1. cp .env.prod.example .env.prod 並填入真實機密（DATABASE_URL / JWT / MFA / Shioaji）。
#   2. 確認 EC2 已放置 /home/ubuntu/etc/ai-stock/tls/server.crt 與 server.key（deploy.sh
#      會在任何 Docker 操作前檢查兩者存在且非空；憑證不得進 Git）。
#   3. echo "$GHCR_TOKEN" | docker login ghcr.io -u <github_user> --password-stdin
#   4. IMAGE_TAG=<commit_sha 或 latest> docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   5. IMAGE_TAG=<同上> docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# 對外只暴露 nginx（80/443）；app 留在內部網路，資料庫連外部 RDS。
# 背景排程（TWAP / idempotency cleanup）在 app 容器內跑（app 為 --workers 1，排程剛好
# 一份）。原本拆獨立 worker 容器（issue #53）已合回 app，見 app.environment 註解。

services:
  # 一次性執行 DB migration，成功後 app 才啟動，避免多 worker 併發跑 alembic。
  # 映像由 CI build 後推到 GHCR；EC2 只 pull，migrate / app 共用同一 IMAGE_TAG。
  migrate:
    image: ghcr.io/fpi-tw/ai-stock:${IMAGE_TAG:-latest}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - backend

  app:
    # 映像由 CI build 後推到 GHCR；EC2 只 pull，不在本機 build。IMAGE_TAG 由部署腳本帶入
    # 該次 commit 的 SHA；未設時退回 latest。migrate / app 共用同一 tag。
    image: ghcr.io/fpi-tw/ai-stock:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # 背景排程（TWAP / idempotency cleanup）就在這個單一容器內跑。Dockerfile 是
      # --workers 1，排程剛好跑一份，不會放大。原本拆出獨立 worker 容器是為了「app
      # 未來開多 uvicorn worker 時排程仍只跑一份」（issue #53），但目前 app 就是
      # 單 process，多開一個 worker 容器只會讓 shioaji 同帳號重複登入、且兩容器各吃
      # ~325MiB 在 t2.micro(952MiB) 撐爆記憶體 → OOM kill。等真要橫向擴展再拆。
      TWAP_WORKER_ENABLED: "true"
      IDEMPOTENCY_CLEANUP_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Cloudflare Full (strict) 仍可走邊緣；443 讓 origin 端到端 TLS 可被驗證。
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 憑證只存在 EC2，與應用部署目錄分離；禁止 Docker 在路徑錯誤時建立空目錄。
      - type: bind
        source: /home/ubuntu/etc/ai-stock/tls
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
    # 固定子網，讓 app 的 TRUSTED_PROXY_IPS 能精準信任 nginx（XFF 取真實 client IP）。
    # 改這裡的話，.env.prod 的 TRUSTED_PROXY_IPS 要一起改。
    ipam:
      config:
        - subnet: 172.28.0.0/16
