# 正式環境部署：postgres + 一次性 migrate + app(FastAPI) + nginx 反向代理。
# 用法：
#   1. cp .env.prod.example .env.prod 並填入真實機密（JWT / MFA / DB 密碼 / Shioaji）。
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 對外只暴露 nginx（80/443）；app 與 postgres 留在內部網路。

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_stock}
      POSTGRES_USER: ${POSTGRES_USER:-ai_stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_stock} -d ${POSTGRES_DB:-ai_stock}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # 一次性執行 DB migration，成功後 app 才啟動，避免多 worker 併發跑 alembic。
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-stock-api:latest
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-stock-api:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # 啟用 TLS 後解除註解，並在 nginx/nginx.conf 補上 443 server 區塊。
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS 憑證掛載（自行放置 fullchain.pem / privkey.pem）。
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
    # 固定子網，讓 app 的 TRUSTED_PROXY_IPS 能精準信任 nginx（XFF 取真實 client IP）。
    # 改這裡的話，.env.prod 的 TRUSTED_PROXY_IPS 要一起改。
    ipam:
      config:
        - subnet: 172.28.0.0/16
