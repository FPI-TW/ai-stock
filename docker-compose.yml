services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ai_stock
      POSTGRES_USER: ai_stock
      POSTGRES_PASSWORD: ai_stock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_stock -d ai_stock"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
