# 正式環境 nginx 反向代理 → app(FastAPI/uvicorn) :8100
# 對外入口，負責限流、gzip、轉發 client 真實資訊與 request id。

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 不洩漏 nginx 版本。
    server_tokens off;

    # --- 日誌：帶上 request id 方便與後端 log 對齊 ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 2m;

    # --- gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain text/css application/xml;

    # --- 邊界限流：補強應用層限流，擋住量級異常的流量 ---
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream app_backend {
        server app:8100;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 啟用 TLS 後，可改為將 80 全量 301 轉址到 https。
        # return 301 https://$host$request_uri;

        # 健康檢查：不套限流，給 LB / 監控用。
        location = /health {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location / {
            limit_req zone=api_limit burst=60 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 沿用既有 request id；缺漏時由後端 middleware 補發。
            proxy_set_header X-Request-Id $http_x_request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # --- TLS server 範本：放好憑證後解除註解，並在 compose 開 443 + 掛 certs ---
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your.domain.example;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     location = /health { proxy_pass http://app_backend; access_log off; }
    #     location / {
    #         limit_req zone=api_limit burst=60 nodelay;
    #         limit_conn conn_limit 20;
    #         proxy_pass http://app_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Connection "";
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_set_header X-Request-Id $http_x_request_id;
    #     }
    # }
}
