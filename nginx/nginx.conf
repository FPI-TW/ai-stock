# 正式環境 nginx 反向代理 → app(FastAPI/uvicorn) :8100
# 對外入口，負責限流、gzip、轉發 client 真實資訊與 request id。

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 不洩漏 nginx 版本。
    server_tokens off;

    # --- Cloudflare：還原真實 client IP ---
    # 經 Cloudflare proxy 後，nginx 的直接 peer 是 Cloudflare，$remote_addr 會是 CF 的 IP。
    # 不還原的話：limit_req_zone($binary_remote_addr) 會把所有經 CF 的流量當成同一個 IP →
    # 全體共用一個限流桶連坐；X-Real-IP / X-Forwarded-For 傳給後端的也是 CF IP。
    # 僅當 peer 落在下列 Cloudflare 官方網段時，才用 CF-Connecting-IP 覆蓋 $remote_addr
    # （直連 EC2 繞過 CF 的流量不在網段內 → 不信任、維持實際 peer，安全）。
    # 網段來源 https://www.cloudflare.com/ips/ ，CF 更新時需同步這份清單。
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    # IPv4
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # --- 日誌：帶上 request id 方便與後端 log 對齊 ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 2m;

    # --- gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain text/css application/xml;

    # --- 邊界限流：補強應用層限流，擋住量級異常的流量 ---
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream app_backend {
        server app:8100;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 啟用 TLS 後，可改為將 80 全量 301 轉址到 https。
        # return 301 https://$host$request_uri;

        # 健康檢查：不套限流，給 LB / 監控用。
        location = /health {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location / {
            limit_req zone=api_limit burst=60 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 沿用既有 request id；缺漏時由後端 middleware 補發。
            proxy_set_header X-Request-Id $http_x_request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # HTTPS（443）目前不做：對外 TLS 由 Cloudflare 邊緣處理，origin 只跑 HTTP(80)。
    # ⚠️ 不要在這裡放 `listen 443 ssl` server 區塊——只要 ssl_certificate 指的檔不存在，
    # nginx 會 [emerg] 整個起不來，連 80 一起拖死。要做 origin HTTPS 時，連同 compose 的
    # 443:443 與憑證掛載、Cloudflare Full(strict) 一起，用獨立 PR 帶回（git 歷史可參考已 revert 的設定）。
}
