[project]
name = "ai-stock"
version = "0.5.0"
description = "AI Stock local FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.7.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.10.0",
    "pyotp>=2.9.0",
    "shioaji>=1.2",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
    "cryptography>=43.0.0",
    "pydantic[email]>=2.12.3",
    # 只有 macOS / Linux 有對應 wheel（見下方 [tool.uv.sources]）；沒有 marker 的話
    # uv 的 universal resolution 會連 Windows 也要解，直接無解。
    "fubon-neo; sys_platform == 'darwin' or sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.1.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require local external services such as PostgreSQL",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = [
    "ANN201",
]

# Shioaji SDK is untyped and its callbacks deliver dynamic payloads. Restrict
# `Any` to the SDK glue + normalisation helpers — every other module still
# requires explicit types.
[tool.ruff.lint.per-file-ignores]
"src/app/services/quote/shioaji_demo/client.py" = ["ANN401"]
"src/app/services/quote/shioaji_demo/normalize.py" = ["ANN401"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["app"]
files = ["src", "tests"]
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

# Shioaji SDK ships without type stubs. Suppress missing-stub errors while
# keeping runtime correctness covered by tests against a mocked SDK.
[[tool.mypy.overrides]]
module = "shioaji.*"
ignore_missing_imports = true

# 富邦 SDK 同樣沒有型別標註（無 py.typed）。
[[tool.mypy.overrides]]
module = "fubon_neo.*"
ignore_missing_imports = true

# Fubon Neo SDK 不上 PyPI，只提供平台專用 wheel，故以本地檔案安裝。
# 每個平台各一顆：開發機（macOS arm64）與 CI / 正式環境（Linux x86_64）。
# wheel 是 cp37-abi3（stable ABI），一顆吃 Python 3.8–3.13；⚠️ 富邦不支援 3.14，
# 升 Python 版本前先確認官方相容性表。
[tool.uv.sources]
fubon-neo = [
    { path = "vendor/fubon_neo-2.2.9-cp37-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin'" },
    { path = "vendor/fubon_neo-2.2.9-cp37-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl", marker = "sys_platform == 'linux'" },
]
