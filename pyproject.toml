[project]
name = "ai-stock"
version = "0.5.0"
description = "AI Stock local FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.7.0",
    "psycopg[binary]>=3.2.0",
    "shioaji>=1.2",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.1.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require local external services such as PostgreSQL",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = [
    "ANN201",
]

# Shioaji SDK is untyped and its callbacks deliver dynamic payloads. Restrict
# `Any` to the SDK glue + normalisation helpers — every other module still
# requires explicit types.
[tool.ruff.lint.per-file-ignores]
"src/app/services/quote/shioaji_demo/client.py" = ["ANN401"]
"src/app/services/quote/shioaji_demo/normalize.py" = ["ANN401"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["app"]
files = ["src", "tests"]
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

# Shioaji SDK ships without type stubs. Suppress missing-stub errors while
# keeping runtime correctness covered by tests against a mocked SDK.
[[tool.mypy.overrides]]
module = "shioaji.*"
ignore_missing_imports = true
